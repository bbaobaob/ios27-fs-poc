name: xtool

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Builds the iOS app with xtool (https://github.com/xtool-org/xtool) instead of
# xcodebuild: no generated .xcodeproj, no pbxproj, and a toolchain that can also
# sign with a free Apple ID if credentials are ever supplied.
#
# xtool is a third-party build tool, not an exploit or PoC implementation. It is
# used purely as build infrastructure, exactly as Xcode is; all probe logic in
# this repository is independently authored. See docs/attribution.md.
concurrency:
  group: xtool-${{ github.ref }}
  cancel-in-progress: true

env:
  # The macOS xtool binary is a GUI app that checks this variable to decide
  # whether it was invoked from the command line. Without it, xtool launches its
  # UI and hangs forever on a headless runner. The Resources/bin/xtool wrapper
  # script sets it too; both are set here so direct invocation is also safe.
  XTL_CLI: "1"

jobs:
  build:
    name: Build the app with xtool
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # xtool is run with stdin closed so that any interactive prompt (2FA, a
      # confirmation) fails the step immediately instead of hanging the job.
      # xtool must never have its stdout redirected to /dev/null (xtool issue
      # #268 crashes in that case), so output goes to a log file instead.

      - name: Download xtool
        timeout-minutes: 10
        run: |
          set -euo pipefail
          echo "Fetching the latest xtool release asset..."
          curl -fL --retry 3 \
            "https://github.com/xtool-org/xtool/releases/latest/download/xtool.app.zip" \
            -o xtool.app.zip
          echo "Downloaded: $(du -h xtool.app.zip | cut -f1)"

      - name: Install xtool
        timeout-minutes: 10
        run: |
          set -euo pipefail
          rm -rf xtool-extract
          mkdir -p xtool-extract
          echo "Unzipping..."
          unzip -q xtool.app.zip -d xtool-extract
          echo "Extracted:"
          ls -lh xtool-extract
          # Files written by curl do not carry the quarantine attribute, but
          # clear it defensively so Gatekeeper cannot block execution.
          xattr -dr com.apple.quarantine xtool-extract/xtool.app 2>/dev/null || true
          # Use xtool's own wrapper script: it resolves the app bundle and sets
          # XTL_CLI=1 before exec'ing the binary.
          echo "XTOOL=$GITHUB_WORKSPACE/xtool-extract/xtool.app/Contents/Resources/bin/xtool" >> "$GITHUB_ENV"
          ls -l "$GITHUB_WORKSPACE/xtool-extract/xtool.app/Contents/Resources/bin/"

      - name: Verify xtool runs
        timeout-minutes: 5
        run: |
          set -euo pipefail
          "$XTOOL" --version </dev/null 2>&1 | tee xtool-version.log
          echo "xtool is runnable"

      - name: Show xtool configuration
        timeout-minutes: 5
        run: |
          "$XTOOL" help dev </dev/null 2>&1 | head -40 || true
          echo "--- App/xtool.yml ---"
          cat App/xtool.yml

      # On macOS this is a no-op: xtool uses the iOS SDK from the host Xcode,
      # so no Xcode.xip download is needed.
      - name: Ensure the Darwin SDK
        timeout-minutes: 10
        run: |
          set +e
          "$XTOOL" sdk install /Applications/Xcode.app --slim </dev/null 2>&1 | tee sdk-install.log
          "$XTOOL" sdk list </dev/null 2>&1 | tee sdk-list.log || true

      - name: Build the IPA with xtool
        timeout-minutes: 25
        working-directory: App
        run: |
          set -o pipefail
          "$XTOOL" dev build \
            --configuration release \
            --ipa </dev/null 2>&1 | tee xtool-build.log

      - name: Locate and inspect the IPA
        timeout-minutes: 5
        run: |
          set -euo pipefail
          IPA="$(find "$GITHUB_WORKSPACE/App" -name '*.ipa' -maxdepth 4 | head -1)"
          if [ -z "$IPA" ]; then
            echo "No .ipa was produced" >&2
            exit 1
          fi
          echo "IPA: $IPA"
          ls -lh "$IPA"
          echo "--- contents ---"
          unzip -l "$IPA" | head -20

      - name: Upload the xtool IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsprobe-xtool-ipa
          path: |
            App/xtool/*.ipa
            App/xtool-build.log
            xtool-version.log
            sdk-install.log
            sdk-list.log
          if-no-files-found: warn
          retention-days: 30
