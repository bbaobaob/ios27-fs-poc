name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Public repository: standard GitHub-hosted runners, including macOS, are free
# for public repos. The macOS runner supplies the Xcode toolchain needed to
# build the harness without a local Mac.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Build and test FSProbeCore (macOS runner)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Build
        run: swift build -c release

      - name: Build tests (no run)
        run: swift build --build-tests -c release

      - name: Test — direct XCTest bundle execution
        timeout-minutes: 10
        run: |
          set -uo pipefail
          BUNDLE="$(find .build -name 'FSProbePackageTests.xctest' -maxdepth 6 | head -1)"
          echo "bundle: $BUNDLE"
          EXEC="$BUNDLE/Contents/MacOS/FSProbePackageTests"
          echo "exec: $EXEC"
          ls -l "$EXEC" || true
          # Run the XCTest bundle binary directly; a hung launch fails fast.
          timeout 180 "$EXEC" 2>&1 | tee test-output.log
          echo "exit=${PIPESTATUS[0]}"

      - name: Run harness on the macOS host
        run: |
          .build/release/fsprobe-cli \
            --label "macos-runner-host" \
            --json matrix-host.json \
            --text matrix-host.txt
        continue-on-error: true

      - name: Platform context (recorded with every host run)
        run: |
          sw_vers
          xcodebuild -version
          uname -m

      - name: Upload matrix, platform context, and test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-host-matrix
          path: |
            matrix-host.json
            matrix-host.txt
            test-output.log
          if-no-files-found: warn
          retention-days: 30
