name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Public repository: standard GitHub-hosted runners, including macOS, are free
# for public repos. The macOS runner supplies the Xcode toolchain needed to
# build the harness without a local Mac.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Build and test FSProbeCore (macOS runner)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Test
        timeout-minutes: 25
        run: |
          set +e
          # Strategy 1: SwiftPM test runner, debug configuration.
          timeout 420 swift test 2>&1 | tee test-output.log
          rc=${PIPESTATUS[0]}
          echo "swift test rc=$rc"
          if [ "$rc" -eq 0 ]; then exit 0; fi

          # Strategy 2: xcodebuild, which uses a different test launch path.
          echo "falling back to xcodebuild test"
          timeout 600 xcodebuild test \
            -scheme FSProbe \
            -destination 'platform=macOS' \
            -configuration Debug 2>&1 | tee xcodebuild-test.log
          rc=${PIPESTATUS[0]}
          echo "xcodebuild test rc=$rc"
          exit "$rc"

      - name: Run harness on the macOS host
        run: |
          .build/release/fsprobe-cli \
            --label "macos-runner-host" \
            --json matrix-host.json \
            --text matrix-host.txt
        continue-on-error: true

      - name: Platform context (recorded with every host run)
        run: |
          sw_vers
          xcodebuild -version
          uname -m

      - name: Upload matrix, platform context, and test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-host-matrix
          path: |
            matrix-host.json
            matrix-host.txt
            test-output.log
            xcodebuild-test.log
          if-no-files-found: warn
          retention-days: 30
