name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Public repository: standard GitHub-hosted runners, including macOS, are free
# for public repos. The macOS runner supplies the Xcode toolchain needed to
# build the harness without a local Mac.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Build and test FSProbeCore (macOS runner)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Build (release)
        run: swift build -c release

      # Runs before the test step so host results are captured even if the
      # test process crashes.
      - name: Run harness on the macOS host
        continue-on-error: true
        run: |
          .build/release/fsprobe-cli \
            --label "macos-runner-host" \
            --json matrix-host.json \
            --text matrix-host.txt

      # macOS has no `timeout` binary, so a hung test run is bounded by a shell
      # watchdog with the step timeout as a backstop.
      - name: Test
        timeout-minutes: 25
        run: |
          set +e
          rm -f test-output.log
          swift test > test-output.log 2>&1 &
          test_pid=$!
          ( sleep 900; kill -9 "$test_pid" 2>/dev/null; echo "watchdog killed swift test after 900s" >> test-output.log ) &
          watchdog_pid=$!
          wait "$test_pid"
          rc=$?
          kill "$watchdog_pid" 2>/dev/null
          cat test-output.log
          echo "swift test rc=$rc"
          exit "$rc"

      - name: Capture crash backtrace
        if: failure()
        continue-on-error: true
        run: |
          set +e
          BUNDLE="$(find .build -name 'FSProbePackageTests.xctest' -maxdepth 6 | head -1)"
          EXEC="$BUNDLE/Contents/MacOS/FSProbePackageTests"
          echo "bundle=$BUNDLE"
          echo "exec=$EXEC"
          lldb -b \
            -o "run" \
            -o "bt all" \
            -o "quit" \
            -- "$EXEC" > crash-backtrace.log 2>&1
          tail -60 crash-backtrace.log

      - name: Platform context (recorded with every host run)
        run: |
          sw_vers
          xcodebuild -version
          uname -m

      - name: Upload matrix, platform context, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-host-matrix
          path: |
            matrix-host.json
            matrix-host.txt
            test-output.log
            crash-backtrace.log
          if-no-files-found: warn
          retention-days: 30
