name: ios

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Public repository: standard GitHub-hosted macOS runners (with Xcode and the
# iOS Simulator runtime) are free for public repos. This is the build-and-run
# path for the iOS app target; the physical-device run is separate and is
# recorded in docs/device-validation-log.md.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FSProbe for iOS Simulator
    # macos-26 carries Xcode 26.6, whose newest iOS SDK is 26.5. That is the closest
    # SDK to iOS 27 any GitHub-hosted runner can provide — probed and recorded in
    # docs/device-validation-log.md, not assumed. The device is the only iOS 27
    # environment that exists; this build is compile validation and IPA production,
    # never evidence about iOS behaviour.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          echo "--- iOS SDKs available ---"
          xcodebuild -showsdks | grep -i ios

      - name: Regenerate the Xcode project from source
        run: python3 scripts/generate_xcode_project.py

      - name: Show available simulator runtimes
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project FSProbe.xcodeproj \
            -scheme FSProbe \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log
        timeout-minutes: 25

      - name: Build for a physical device (compile-only)
        # Compiling for iphoneos proves the code is valid device code. It is
        # not signed and cannot be installed; signing needs a real Apple ID.
        run: |
          set -o pipefail
          xcodebuild build \
            -project FSProbe.xcodeproj \
            -scheme FSProbe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build-device.log
        timeout-minutes: 25

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$(find "$PWD/build/DerivedDataDevice" -name 'FSProbe.app' -maxdepth 5 | head -1)"
          if [ -z "$APP" ]; then
            echo "FSProbe.app was not produced by the device build" >&2
            exit 1
          fi
          echo "App bundle: $APP"
          ls -lh "$APP"

          # Confirm we packaged the app we think we did.
          echo "--- bundle identity ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"

          # An IPA is Payload/<App>.app at the archive root.
          #
          # zip -r -y is used rather than `ditto -c -k --keepParent`: ditto's
          # --keepParent embeds only the source's own name, which produced an
          # archive rooted at FSProbe.app/ with no Payload/ directory. Installers
          # (zsign reported "Can't find payload directory!") reject that.
          # -y stores symlinks as symlinks instead of following them.
          rm -rf Payload FSProbe-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -q -r -y FSProbe-unsigned.ipa Payload
          ls -lh FSProbe-unsigned.ipa

          echo "--- IPA contents ---"
          unzip -l FSProbe-unsigned.ipa

      - name: Validate the IPA layout
        run: |
          set -euo pipefail
          # Regression guard: the archive must be rooted at Payload/ and contain
          # the app bundle inside it. A malformed IPA installs nowhere, and the
          # failure only shows up on the device.
          LISTING="$(unzip -Z1 FSProbe-unsigned.ipa)"
          echo "$LISTING"
          echo "$LISTING" | grep -qx 'Payload/' || {
            echo "FAIL: archive root is not Payload/" >&2; exit 1; }
          echo "$LISTING" | grep -qx 'Payload/FSProbe.app/' || {
            echo "FAIL: Payload/FSProbe.app/ is missing" >&2; exit 1; }
          echo "$LISTING" | grep -qx 'Payload/FSProbe.app/Info.plist' || {
            echo "FAIL: Payload/FSProbe.app/Info.plist is missing" >&2; exit 1; }
          echo "$LISTING" | grep -qx 'Payload/FSProbe.app/FSProbe' || {
            echo "FAIL: the app executable is missing" >&2; exit 1; }
          if echo "$LISTING" | grep -qv '^Payload/'; then
            echo "FAIL: entries exist outside Payload/" >&2; exit 1; fi
          echo "IPA layout is valid"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build.log
            build-device.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FSProbe-unsigned-ipa
          path: FSProbe-unsigned.ipa
          if-no-files-found: warn
          retention-days: 30

  simulator-run:
    name: Run FSProbe in the iOS Simulator and capture the matrix
    runs-on: macos-15
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the Xcode project from source
        run: python3 scripts/generate_xcode_project.py

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project FSProbe.xcodeproj \
            -scheme FSProbe \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -20

      - name: Boot an iPhone simulator
        run: |
          set -euo pipefail
          # Pick the newest available iOS runtime. Note: the macOS-15 runner
          # image tops out below iOS 27, so the newest runtime here is still
          # not the research target. See docs/device-validation-log.md.
          UDID="$(xcrun simctl list devices available -j \
            | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)
          best = None
          for runtime, devices in data["devices"].items():
              m = re.search(r"SimRuntime\.iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              if best is None or version > best[0]:
                  best = (version, runtime, devices)
          if best is None:
              raise SystemExit("no iOS runtime found")
          version, runtime, devices = best
          print(f"newest iOS runtime: {runtime} ({version[0]}.{version[1]})", file=sys.stderr)
          for d in devices:
              if d["name"].startswith("iPhone") and d["isAvailable"]:
                  print(d["udid"])
                  raise SystemExit(0)
          raise SystemExit("no available iPhone in the newest runtime")
          ')"
          echo "Selected simulator UDID: $UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || echo "already booted"
          xcrun simctl bootstatus "$UDID" -b
          RUNTIME="$(xcrun simctl list runtimes -j \
            | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)
          for r in data["runtimes"]:
              m = re.search(r"iOS-(\d+)-(\d+)", r.get("identifier", ""))
              if m:
                  print(f"ios{m.group(1)}-{m.group(2)}")
                  break
          ')"
          echo "SIMULATOR_RUNTIME=$RUNTIME" >> "$GITHUB_ENV"
          echo "Runtime label: $RUNTIME"

      - name: Install and launch the app
        run: |
          set -euo pipefail
          APP="$(find "$PWD/build/DerivedData" -name 'FSProbe.app' -maxdepth 5 | head -1)"
          echo "App bundle: $APP"
          xcrun simctl install "$SIMULATOR_UDID" "$APP"
          xcrun simctl launch "$SIMULATOR_UDID" com.bbaobaob.fsprobe
          # The app computes the matrix on launch and writes matrix.json /
          # matrix.txt into its Documents directory, plus matrix-partial.json /
          # matrix-partial.txt after every phase. The battery grew past the old
          # 120-second budget (the embedded-XPC phase alone can take ~25 seconds
          # worst case), so the budget grew with it: 30 iterations at 5 seconds.
          for i in $(seq 1 30); do
            sleep 5
            CONTAINER="$(xcrun simctl get_app_container "$SIMULATOR_UDID" com.bbaobaob.fsprobe data 2>/dev/null || true)"
            if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/matrix.json" ]; then
              echo "matrix.json appeared after $((i * 5))s"
              break
            fi
            echo "waiting for matrix.json ($((i * 5))s)"
          done

      - name: Extract the results
        run: |
          set -euo pipefail
          CONTAINER="$(xcrun simctl get_app_container "$SIMULATOR_UDID" com.bbaobaob.fsprobe data)"
          echo "App data container: $CONTAINER"
          ls -lh "$CONTAINER/Documents/" || true
          # Partial files are best-effort by design: they exist only if at least
          # one phase finished. Their absence alongside a missing matrix.json
          # means the run died before the first phase completed.
          for f in matrix-partial.json matrix-partial.txt; do
            if [ -f "$CONTAINER/Documents/$f" ]; then
              cp "$CONTAINER/Documents/$f" "ios-simulator-$f"
              echo "picked up $f"
            fi
          done
          cp "$CONTAINER/Documents/matrix.json" matrix-ios-simulator.json
          cp "$CONTAINER/Documents/matrix.txt" matrix-ios-simulator.txt
          echo "--- matrix.txt ---"
          cat matrix-ios-simulator.txt

      - name: Capture simulator diagnostics
        if: always()
        run: |
          set +e
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 5m --predicate \
            'process == "FSProbe"' > simulator-app.log 2>&1
          xcrun simctl terminate "$SIMULATOR_UDID" com.bbaobaob.fsprobe 2>&1 || true
          tail -40 simulator-app.log || true

      - name: Upload the simulator matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-matrix
          path: |
            matrix-ios-simulator.json
            matrix-ios-simulator.txt
            ios-simulator-matrix-partial.json
            ios-simulator-matrix-partial.txt
            simulator-app.log
          if-no-files-found: warn
          retention-days: 30
